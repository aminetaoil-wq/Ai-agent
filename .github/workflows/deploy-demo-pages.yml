name: Deploy demo to GitHub Pages

# Publishes klusraak/frontend/public to the gh-pages branch. Using the
# branch-based publish (peaceiris/actions-gh-pages) instead of
# actions/deploy-pages because the latter requires the auto-created
# `github-pages` environment to allow this branch — which it doesn't by
# default. This approach pushes directly to gh-pages and works as long
# as the repo's Pages source is set to "Deploy from a branch: gh-pages".

on:
  push:
    branches:
      - claude/enhance-ai-agent-repo-08eo2
    paths:
      - 'klusraak/frontend/public/**'
      - '.github/workflows/deploy-demo-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: klusraak/frontend/public
          publish_branch: gh-pages
          force_orphan: true
          cname: ''
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: publish demo from ${{ github.sha }}'

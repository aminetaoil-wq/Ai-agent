# Local dev stack: Postgres + API. The frontend is static — serve it with any
# static server (e.g. `python3 -m http.server` from frontend/public).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: klusraak
      POSTGRES_PASSWORD: klusraak
      POSTGRES_DB: klusraak
    ports:
      - '5432:5432'
    volumes:
      - klusraak_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U klusraak -d klusraak']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
      DATABASE_URL: postgresql://klusraak:klusraak@db:5432/klusraak?schema=public
      JWT_ACCESS_SECRET: dev-access-secret-change-in-production
      JWT_REFRESH_SECRET: dev-refresh-secret-change-in-production
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 2592000
    ports:
      - '4000:4000'

volumes:
  klusraak_db:
